# needs to be at the top for some reason
set -sg escape-time 10		# zero-out escape time delay

# Set new prefix to ctrl+space
unbind C-b
set-option -g prefix C-space
bind C-Space send-prefix

# reload config file
bind r source-file ~/.tmux.conf
bind N new-session

# split more intuitively
unbind -T prefix \"
unbind -T prefix \%
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind-key + \
 'split-window -v -c "#{pane_current_path}" ; \
  split-window -h -c "#{pane_current_path}" ; select-pane -U ; \
  split-window -h -c "#{pane_current_path}" ; select-pane -L ;'

# act vim-like
setw -g mode-keys vi

# Alt+hjkl crosses tmux panes AND nvim splits with one keystroke.
# Detects whether the pane is running vim/nvim; if so, forwards the key to it
# instead of switching panes. Pairs with vim-tmux-navigator in nvim/init.lua.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'select-pane -R'
# escape hatch when the detection guesses wrong
bind-key -n M-Space select-pane -t :.+

# resize panes -- -r means "repeatable", so hold the key without re-pressing leader
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy-mode: select and yank with vim keys, straight to the system clipboard
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
# drag-select with the mouse without the selection vanishing on release
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe

# kill without question
bind x kill-pane
bind & kill-window

# PLUGINS
# ~/.tmux is a symlink to the dotfiles repo, so point tpm somewhere else --
# otherwise every plugin's source tree lands inside this git repo.
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # leader+Ctrl-s save, leader+Ctrl-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # ...and do it automatically

# survive a reboot / `wsl --shutdown`, which a bare tmux server does not
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# STATUS BAR
set -g status-interval 1
set -g status-justify left
set -g status-position bottom
set -g status-left-length 200

set -g @COLOR1 '#87CEEB'
set -g @COLOR2 'black'

source-file ~/.tmux/status_style_basic.conf
#set -g -F status-left '#{?client_prefix,#[fg=black#,bg=green],}  #S #[fg=#45475a,bg=#{@COLOR2}]|'
set-hook -g after-resize-pane 'if "[ #{window_zoomed_flag} -eq 1 ]" "source-file ~/.tmux/status_style_zoom.conf" "source-file ~/.tmux/status_style_basic.conf"'
set-hook -g pane-focus-in 'if "[ #{window_zoomed_flag} -eq 1 ]" "source-file ~/.tmux/status_style_zoom.conf" "source-file ~/.tmux/status_style_basic.conf"'
set-hook -g pane-focus-out 'if "[ #{window_zoomed_flag} -eq 1 ]" "source-file ~/.tmux/status_style_zoom.conf" "source-file ~/.tmux/status_style_basic.conf"'
set-hook -g window-pane-changed 'if "[ #{window_zoomed_flag} -eq 1 ]" "source-file ~/.tmux/status_style_zoom.conf" "source-file ~/.tmux/status_style_basic.conf"'
set-hook -g session-window-changed 'if "[ #{window_zoomed_flag} -eq 1 ]" "source-file ~/.tmux/status_style_zoom.conf" "source-file ~/.tmux/status_style_basic.conf"'

# pane border colors
set -g pane-border-style 'fg=black'
set -g pane-active-border-style 'fg=#87CEEB'

set-option -g default-terminal 'tmux-256color'
set -sa terminal-features ',xterm-256color:RGB'
set -sa terminal-features ',*:clipboard'   # let tmux use OSC 52 to reach the host clipboard

# start windows/panes at 1 and renumber
set -g base-index 1 		# start indexing windows at 1 instead of 0
setw -g pane-base-index 1       # start indexing panes at 1 instead of 0
set -g renumber-windows on	# renumber all windows when any window is closed

# misc
setw -g monitor-activity on
set -g visual-activity on
set-option -g display-time 2500
set -g mouse on
set -g history-limit 10000 	# increase history size (from 2,000)
set -g set-clipboard on 	# use system clipboard
set -g focus-events on		# let nvim see focus gained/lost (autoread, autosave)
set -g detach-on-destroy off	# killing the last window switches session, not detach

# MUST BE LAST: tpm overwrites bindings it manages.
# Installs itself via install.sh; leader+I inside tmux fetches the plugins.
if "test -d ~/.local/share/tmux/plugins/tpm" \
   "run '~/.local/share/tmux/plugins/tpm/tpm'"

