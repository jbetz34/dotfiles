# Status bar style - normal, zoomed and bell looks in one file
#
# @COLOR1 is the accent (blue), @COLOR2 the base (black).
#   unzoomed : black bar, blue text;  active tab = blue bg, black text
#   zoomed   : blue bar, black text; active tab = black bg, blue text
#   bell     : yellow bg, black text, leading '&' (overrides both)
#
# status-style is evaluated in session context, so window_zoomed_flag here refers
# to the ACTIVE window. status-left/right and the inactive tabs set no colors of
# their own, so they inherit it and follow the zoom state with no hooks needed
#
# NB: never set status-bg/status-fg alongside this. They are deprecated aliases
# that override status-style, and a stale 'status-bg black' renders the whole bar
# black-on-black while zoomed.
set -g status-style 'fg=#{?window_zoomed_flag,#{@COLOR2},#{@COLOR1}},bg=#{?window_zoomed_flag,#{@COLOR1},#{@COLOR2}}'

# The bell look is done in window-status-format below, so neutralize the built-in
# bell/activity styles - tmux applies them first and its default adds a reverse.
setw -g window-status-bell-style default
setw -g window-status-activity-style default

set -g status-left ' $ #S #[fg=#45475a]|#[default]'
set -g status-right '#{?window_zoomed_flag, zoomed-in + ,}#[fg=#45475a]|#[default] %m/%d/%y %H:%M:%S'

# Active window: the inverse of the bar - explicit colors rather than #[reverse]
# so it stays correct regardless of what syling precedes it.
set -g window-status-current-format '#[fg=#{?window_zoomed_flag,#{@COLOR1},#{@COLOR2}}#,bg=#{?window_zoomed_flag,#{@COLOR2},#{@COLOR1}}] #I* #W #[default]'

# Inactive window: inherits the bar, unless it rang the bell -> yellow + '&'
# the '#,' is an escaped comma; a bare ',' would terminate the #{?...} branch
set -g window-status-format '#{?window_bell_flag,#[fg=#{@COLOR2}#,bg=yellow] &, }#I #W #[default]'
